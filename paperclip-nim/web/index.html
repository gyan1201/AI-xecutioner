<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paperclip × NVIDIA NIM</title>
    <meta name="description" content="A Paperclip clone where every agent, skill, blueprint and endpoint runs on NVIDIA NIM." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=__ASSET_VERSION__" />
    <!--
      Critical rules, inlined on purpose: they must apply before (or without) the
      stylesheet, because an overlay that paints on top of the app at boot looks
      exactly like a blank page. `hidden` wins over the `display: flex/grid` on
      .palette/.modal-root/.drawer-root; the boot shell below stays readable even
      if the module graph never executes.
    -->
    <style>
      [hidden] { display: none !important; }
      html, body { margin: 0; background: #060607; color: #f2f2f4; }
      #boot { display: grid; place-items: center; min-height: 100vh; font: 13px/1.6 ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px; }
      #boot .boot-mark { font-size: 26px; letter-spacing: .18em; color: #76b900; font-weight: 600; }
      #boot-status { margin-top: 10px; color: #8b8b93; max-width: 54ch; }
      #boot-status.error { color: #ff8f8f; white-space: pre-wrap; text-align: left; }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <a class="brand-mark" href="#/dashboard" aria-label="Dashboard">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M9 7h9a6 6 0 0 1 0 12h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
              <path d="M9 7v18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
              <path d="M17 19v6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </a>
          <button class="company-switch" id="company-switch" aria-haspopup="menu">
            <span class="company-name" id="company-name">Loading…</span>
            <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
          <button class="icon-btn" id="global-search" title="Search (⌘K)" aria-label="Search">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.3 10.3L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button class="new-issue" id="new-issue">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 11.5V13h1.5l7-7-1.5-1.5-7 7zM11.3 3.3l1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>New issue</span>
          <kbd>C</kbd>
        </button>
        <nav class="nav" id="nav" aria-label="Main"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>

      <main class="main" id="main">
        <header class="topbar" id="topbar">
          <div class="crumbs" id="crumbs"></div>
          <div class="topbar-actions">
            <span class="mode-chip" id="mode-chip" title="NIM connection mode">…</span>
            <button class="btn ghost sm" id="run-cycle">
              <span class="pulse-dot" aria-hidden="true"></span> Run cycle
            </button>
          </div>
        </header>
        <div class="view" id="view" role="main">
          <div class="boot" id="boot">
            <div class="boot-mark">✂</div>
            <h1>Paperclip × NVIDIA NIM</h1>
            <p id="boot-status">Starting the control room…</p>
            <noscript><p class="boot-error">This app needs JavaScript. Enable it and reload.</p></noscript>
          </div>
        </div>
      </main>
    </div>

    <div class="palette" id="palette" hidden>
      <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Command palette">
        <input id="palette-input" type="text" placeholder="Search issues, agents, skills, pages…" autocomplete="off" />
        <div class="palette-results" id="palette-results"></div>
        <div class="palette-foot"><kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>↵</kbd> open <kbd>esc</kbd> close</div>
      </div>
    </div>

    <div class="modal-root" id="modal-root" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="drawer-root" id="drawer-root" hidden></div>

    <!-- Runs as a classic script so it can report a failure even when the module graph
         never loads: a blank screen is never an acceptable error state. -->
    <script>
      window.__pcBooted = false;
      window.__pcFail = function (message) {
        var status = document.getElementById("boot-status");
        if (status) {
          status.textContent = message;
          status.className = "boot-error";
        }
      };
      window.addEventListener("error", function (event) {
        if (window.__pcBooted) return;
        var target = event.target;
        if (target && target.tagName === "SCRIPT") {
          window.__pcFail("Could not load " + (target.src || "a script") + " — reload, and check the server log.");
          return;
        }
        window.__pcFail("Startup error: " + (event.message || "unknown") + " — see the browser console.");
      }, true);
      window.addEventListener("unhandledrejection", function (event) {
        if (window.__pcBooted) return;
        var reason = event.reason;
        window.__pcFail("Startup failed: " + ((reason && reason.message) || reason || "unknown error"));
      });
      setTimeout(function () {
        if (!window.__pcBooted) {
          window.__pcFail("Still starting after 8s. Check /api/health, then reload.");
        }
      }, 8000);
    </script>
    <script type="module" src="/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
